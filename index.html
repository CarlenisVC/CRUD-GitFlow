<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDP3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="crud-card">
            <section class="crud">
                <h1 class="crud-title">Usuarios</h1>

                <form id="Registro" class="crud_formulario">
                    <input type="text" placeholder="Nombre" id="nameInput">
                    <input type="email" placeholder="Email" id="emailInput">
                    <button type="submit" id="submitButton">Agregar</button>
                </form>

                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="tableBody"></tbody>
                </table>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
